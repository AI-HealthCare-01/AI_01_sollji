events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    client_max_body_size 10M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name chroniccare.site www.chroniccare.site 54.180.193.218;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name chroniccare.site www.chroniccare.site;

        ssl_certificate     /etc/letsencrypt/live/chroniccare.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chroniccare.site/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }

        location ~* ^/(?:\.env|\.git|\.svn|\.hg|\.DS_Store|server-status|info\.php|config\.json|telescope|console|graphql|graphql/api|api/graphql|api/gql) {
            return 404;
        }

        location = /docs { return 404; }
        location = /redoc { return 404; }
        location = /openapi.json { return 404; }
        location = /swagger-ui.html { return 404; }
        location = /swagger/index.html { return 404; }
        location = /swagger/swagger-ui.html { return 404; }
        location = /webjars/swagger-ui/index.html { return 404; }

        # 백엔드 API
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;

            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
        }

        location /static/ {
            proxy_pass http://backend/static/;
        }

        # 프론트엔드
        location / {
            proxy_pass         http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
        }
    }
}
